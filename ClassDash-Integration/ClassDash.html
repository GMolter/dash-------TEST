<meta charset="UTF-8">
<title>ClassDash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme: light dark; /* lets transparent regions use the right dark/light canvas automatically */
    --bg: transparent;
    --panel: rgba(255,255,255,0.16);
    --panel-2: rgba(228,232,238,0.22);
    --board: rgba(22,26,33,0.26);
    --board-2: rgba(32,37,47,0.26);
    --text:#1b2029;
    --text-muted:#5b6472;
    --text-on-board:#f2f4f8;
    --text-on-board-muted:#a5adba;
    --border: rgba(211,217,226,0.45);
    --board-border: rgba(120,128,145,0.35);
    --accent:#a85f10;
    --accent-on-board:#ffb020;
    --good:#2f8f5b;
    --good-on-board:#5fd39a;
    --urgent:#c23b32;
    --urgent-on-board:#ff6b5c;
    --crimson:#c8102e;
    --crimson-glow:rgba(200,16,46,0.38);
    --glass-blur: blur(26px) saturate(180%) brightness(1.06);
    --glass-border: rgba(255,255,255,0.55);
    --glass-rim-top: rgba(255,255,255,0.75);
    --glass-rim-bottom: rgba(15,18,24,0.10);
    --glass-sheen: rgba(255,255,255,0.55);
    --glass-sheen-2: rgba(255,255,255,0);
    --shadow: 0 1px 2px rgba(20,24,32,0.05), 0 8px 28px rgba(20,24,32,0.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: transparent;
      --panel: rgba(27,31,39,0.2);
      --panel-2: rgba(35,40,51,0.26);
      --board: rgba(9,11,15,0.32);
      --board-2: rgba(18,21,27,0.32);
      --text:#eef1f6;
      --text-muted:#93a0b3;
      --text-on-board:#f2f4f8;
      --text-on-board-muted:#8b96a8;
      --border: rgba(120,131,153,0.28);
      --board-border: rgba(120,131,153,0.24);
      --accent:#ffb020;
      --accent-on-board:#ffb020;
      --good:#5fd39a;
      --good-on-board:#5fd39a;
      --urgent:#ff6b5c;
      --urgent-on-board:#ff6b5c;
      --glass-border: rgba(255,255,255,0.16);
      --glass-rim-top: rgba(255,255,255,0.22);
      --glass-rim-bottom: rgba(0,0,0,0.4);
      --glass-sheen: rgba(255,255,255,0.12);
      --glass-sheen-2: rgba(255,255,255,0);
      --shadow: 0 1px 2px rgba(0,0,0,0.25), 0 12px 32px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"]{
    --bg: transparent;
    --panel: rgba(27,31,39,0.2);
    --panel-2: rgba(35,40,51,0.26);
    --board: rgba(9,11,15,0.32);
    --board-2: rgba(18,21,27,0.32);
    --text:#eef1f6;
    --text-muted:#93a0b3;
    --text-on-board:#f2f4f8;
    --text-on-board-muted:#8b96a8;
    --border: rgba(120,131,153,0.28);
    --board-border: rgba(120,131,153,0.24);
    --accent:#ffb020;
    --accent-on-board:#ffb020;
    --good:#5fd39a;
    --good-on-board:#5fd39a;
    --urgent:#ff6b5c;
    --urgent-on-board:#ff6b5c;
    --glass-border: rgba(255,255,255,0.16);
    --glass-rim-top: rgba(255,255,255,0.22);
    --glass-rim-bottom: rgba(0,0,0,0.4);
    --glass-sheen: rgba(255,255,255,0.12);
    --glass-sheen-2: rgba(255,255,255,0);
    --shadow: 0 1px 2px rgba(0,0,0,0.25), 0 12px 32px rgba(0,0,0,0.3);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .tabular{ font-variant-numeric: tabular-nums; }

  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:28px 24px 60px;
  }

  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  header.top .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  header.top h1{
    font-family:"Big Shoulders Display", ui-sans-serif, sans-serif;
    font-weight:800;
    font-size:30px;
    letter-spacing:0.5px;
    margin:0;
    text-transform:uppercase;
  }
  header.top .tagline{
    color:var(--text-muted);
    font-size:13px;
  }
  header.top .clock{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:15px;
    color:var(--text-muted);
    text-align:right;
  }
  header.top .clock .date{
    font-size:12.5px;
    margin-top:2px;
  }
  .header-actions{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .pip-btn{
    background:var(--panel-2);
    border:1px solid var(--glass-border);
    color:var(--text);
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:12px;
    letter-spacing:0.3px;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    backdrop-filter:var(--glass-blur);
    -webkit-backdrop-filter:var(--glass-blur);
    box-shadow:inset 0 1px 0 var(--glass-rim-top), inset 0 -1px 0 var(--glass-rim-bottom);
  }
  .pip-btn:hover:not(:disabled){ border-color:var(--accent); color:var(--accent); }
  .pip-btn.active{ border-color:var(--crimson); color:var(--crimson); }
  .pip-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .pip-btn:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  .grid{
    display:grid;
    grid-template-columns: 1.55fr 1fr;
    gap:20px;
    align-items:start;
  }
  @media (max-width:860px){
    .grid{ grid-template-columns: 1fr; }
  }

  /* ---- Liquid-glass surface: blurred + saturated backdrop, a bright hairline
     rim, an inset highlight/shadow pair that reads as glass thickness, and a
     soft specular sheen swept across the top-left corner. ---- */
  .panel, .board{
    position:relative;
    overflow:hidden;
    border-radius:22px;
    border:1px solid var(--glass-border);
    box-shadow:
      inset 0 1px 0 var(--glass-rim-top),
      inset 0 -1px 0 var(--glass-rim-bottom),
      var(--shadow);
    backdrop-filter:var(--glass-blur);
    -webkit-backdrop-filter:var(--glass-blur);
  }
  .panel::before, .board::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(120% 90% at 12% -10%, var(--glass-sheen), var(--glass-sheen-2) 60%),
      linear-gradient(115deg, var(--glass-sheen) -10%, var(--glass-sheen-2) 30%);
    mix-blend-mode:overlay;
    pointer-events:none;
  }
  .panel{ background:var(--panel); }

  /* ---- Board (countdown hero) ---- */
  .board{
    background:linear-gradient(180deg, var(--board), var(--board-2));
    border-radius:28px;
    padding:26px 28px 22px;
    color:var(--text-on-board);
  }
  .board, .board *{
    text-shadow:0 1px 4px rgba(0,0,0,0.5);
  }
  .board .eyebrow{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:11.5px;
    letter-spacing:1.6px;
    text-transform:uppercase;
    color:var(--text-on-board-muted);
    margin-bottom:6px;
  }
  .board .status-line{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .board .pill{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:11.5px;
    letter-spacing:0.8px;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:999px;
    border:1px solid var(--glass-border);
    color:var(--text-on-board-muted);
    background:rgba(255,255,255,0.06);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.14);
  }
  .board .pill.urgent{ color:var(--urgent-on-board); border-color:var(--urgent-on-board); }
  .board .pill.good{ color:var(--good-on-board); border-color:var(--good-on-board); }
  .board .pill.accent{ color:var(--accent-on-board); border-color:var(--accent-on-board); }

  .board .course-line{
    font-family:"Big Shoulders Display", ui-sans-serif, sans-serif;
    font-weight:700;
    font-size:22px;
    text-transform:uppercase;
    letter-spacing:0.3px;
    margin-bottom:2px;
  }
  .board .course-sub{
    color:var(--text-on-board-muted);
    font-size:13.5px;
    margin-bottom:20px;
  }

  .board{ overflow-x:auto; }
  .board .countdown{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-weight:600;
    font-size:clamp(56px, 10vw, 128px);
    line-height:1;
    color:var(--crimson);
    text-shadow:0 0 34px var(--crimson-glow);
    letter-spacing:1px;
    white-space:nowrap;
    transition:font-size 1s cubic-bezier(0.22,1,0.36,1), text-shadow 1s ease;
  }
  .board .countdown.max{
    font-size:clamp(84px, 15vw, 190px);
    text-shadow:0 0 54px var(--crimson-glow);
  }
  @media (prefers-reduced-motion: reduce){
    .board .countdown{ transition:none; }
    .board .countdown.max{ font-size:clamp(56px, 10vw, 128px); }
  }
  .board .countdown-label{
    font-size:14px;
    color:var(--text-on-board-muted);
    margin-top:10px;
  }
  .board .countdown-label b{ color:var(--text-on-board); font-weight:600; }

  .board .meta-row{
    display:flex;
    gap:24px;
    margin-top:20px;
    padding-top:16px;
    border-top:1px solid var(--board-border);
    flex-wrap:wrap;
  }
  .board .meta{
    font-size:12.5px;
    color:var(--text-on-board-muted);
  }
  .board .meta .v{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:15px;
    color:var(--text-on-board);
    margin-top:3px;
  }

  /* ---- Today timeline ---- */
  .section-title{
    font-family:"Big Shoulders Display", ui-sans-serif, sans-serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--text-muted);
    margin:26px 0 10px;
  }
  .timeline{
    padding:6px;
  }
  .row{
    display:grid;
    grid-template-columns: 84px 1fr auto;
    gap:14px;
    align-items:center;
    padding:13px 14px;
    border-radius:10px;
  }
  .row + .row{ border-top:1px solid var(--border); }
  .row .time{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:13.5px;
    color:var(--text-muted);
  }
  .row.current .time{ color:var(--accent); font-weight:600; }
  .row .course{
    font-weight:600;
    font-size:14.5px;
  }
  .row .place{
    color:var(--text-muted);
    font-size:12.5px;
    margin-top:2px;
  }
  .row.done{ opacity:0.45; }
  .state{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:10.5px;
    letter-spacing:0.6px;
    text-transform:uppercase;
    padding:4px 9px;
    border-radius:999px;
    border:1px solid var(--glass-border);
    color:var(--text-muted);
    white-space:nowrap;
    box-shadow:inset 0 1px 0 var(--glass-rim-top);
  }
  .state.current{ color:var(--accent); border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent); }
  .state.leave{ color:var(--urgent); border-color:var(--urgent); background:color-mix(in srgb, var(--urgent) 12%, transparent); }
  .state.done{ color:var(--good); border-color:var(--good); }

  .empty-note{
    padding:22px 16px;
    text-align:center;
    color:var(--text-muted);
    font-size:13.5px;
  }

  /* ---- Sidebar ---- */
  .side-panel{
    padding:18px 18px 8px;
  }
  .side-panel .section-title{ margin-top:0; }

  .week-strip{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap:8px;
    margin-bottom:4px;
  }
  .day-chip{
    border:1px solid var(--glass-border);
    border-radius:16px;
    padding:9px 6px;
    text-align:center;
    background:var(--panel-2);
    box-shadow:inset 0 1px 0 var(--glass-rim-top);
  }
  .day-chip.today{
    border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 14%, var(--panel-2));
  }
  .day-chip .d{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:10.5px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .day-chip.today .d{ color:var(--accent); }
  .day-chip .n{
    font-family:"Big Shoulders Display", sans-serif;
    font-weight:700;
    font-size:20px;
    margin-top:2px;
  }
  .day-chip .lbl{
    font-size:9.5px;
    color:var(--text-muted);
    margin-top:1px;
  }

  footer.foot{
    margin-top:26px;
    text-align:center;
    color:var(--text-muted);
    font-size:11.5px;
  }
</style>

<div class="wrap">

  <header class="top">
    <div class="brand">
      <h1>ClassDash</h1>
      <span class="tagline">next class, travel time, leave on time</span>
    </div>
    <div class="header-actions">
      <button id="pipBtn" class="pip-btn" type="button" title="Pop the countdown out into an always-on-top overlay">⧉ Pop out</button>
      <div class="clock">
        <div id="clockTime" class="tabular">--:--:--</div>
        <div id="clockDate" class="date">loading…</div>
      </div>
    </div>
  </header>

  <div class="grid">

    <!-- LEFT COLUMN -->
    <div>
      <div class="board" id="board">
        <div class="eyebrow" id="boardEyebrow">LOADING SCHEDULE</div>
        <div class="status-line" id="boardStatusLine"></div>
        <div class="course-line" id="boardCourse">—</div>
        <div class="course-sub" id="boardCourseSub">—</div>
        <div class="countdown tabular" id="boardCountdown">--:--</div>
        <div class="countdown-label" id="boardCountdownLabel">—</div>
        <div class="meta-row" id="boardMetaRow"></div>
      </div>

      <div class="section-title">Today</div>
      <div class="panel timeline" id="timeline"></div>
    </div>

    <!-- RIGHT COLUMN -->
    <div>
      <div class="panel side-panel">
        <div class="section-title" style="margin-top:0">This week</div>
        <div class="week-strip" id="weekStrip"></div>
      </div>

    </div>

  </div>

  <footer class="foot">This standalone prototype is superseded by the account-backed ClassDash plugin in Olio Workstation.</footer>
</div>

<script>
(function(){

  // The integrated ClassDash loads each signed-in user's schedule from Olio.
  // day: 0=Sun 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat
  const SCHEDULE = [];

  const DAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const WEEKDAYS = [1,2,3,4,5];

  function parseHM(str){
    const [h,m] = str.split(":").map(Number);
    return {h,m};
  }
  function atTime(date, hm){
    const d = new Date(date);
    d.setHours(hm.h, hm.m, 0, 0);
    return d;
  }
  function addDays(date, n){
    const d = new Date(date);
    d.setDate(d.getDate()+n);
    return d;
  }
  function sameDate(a,b){
    return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }
  function fmtClock(date){
    return date.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  }
  function fmtClockSec(date){
    return date.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false});
  }
  function fmtCountdown(ms){
    let s = Math.max(0, Math.round(ms/1000));
    const h = Math.floor(s/3600); s -= h*3600;
    const m = Math.floor(s/60); s -= m*60;
    if(h>0) return h + ":" + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
    return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
  }

  // Build instances for the next 8 days (today .. today+7)
  function buildInstances(now){
    const instances = [];
    for(let offset=0; offset<8; offset++){
      const d = addDays(now, offset);
      const dow = d.getDay();
      SCHEDULE.filter(c => c.day === dow).forEach(c => {
        const start = atTime(d, parseHM(c.start));
        const end = atTime(d, parseHM(c.end));
        const leaveBy = new Date(start.getTime() - c.travel*60000);
        instances.push({ cls:c, date:d, start, end, leaveBy, dayOffset:offset });
      });
    }
    instances.sort((a,b) => a.start - b.start);
    return instances;
  }

  // Cache element references once. Cached references stay valid even after the
  // #board element is reparented into a Picture-in-Picture window's document,
  // since the PiP window shares this same JS context — only document.getElementById
  // (scoped to whichever document a node currently lives in) would break.
  const els = {
    clockTime: document.getElementById("clockTime"),
    clockDate: document.getElementById("clockDate"),
    boardEyebrow: document.getElementById("boardEyebrow"),
    boardStatusLine: document.getElementById("boardStatusLine"),
    boardCourse: document.getElementById("boardCourse"),
    boardCourseSub: document.getElementById("boardCourseSub"),
    boardCountdown: document.getElementById("boardCountdown"),
    boardCountdownLabel: document.getElementById("boardCountdownLabel"),
    boardMetaRow: document.getElementById("boardMetaRow"),
    timeline: document.getElementById("timeline"),
    weekStrip: document.getElementById("weekStrip"),
  };

  function render(){
    const now = new Date();

    // Every 5 minutes, hold the countdown at max size for 30s, then ease back down.
    const CYCLE_SECONDS = 300, HOLD_SECONDS = 30;
    const epochSeconds = Math.floor(now.getTime()/1000);
    const inMaxWindow = (epochSeconds % CYCLE_SECONDS) < HOLD_SECONDS;
    els.boardCountdown.classList.toggle("max", inMaxWindow);

    els.clockTime.textContent = fmtClockSec(now);
    els.clockDate.textContent = now.toLocaleDateString([], {weekday:"long", month:"long", day:"numeric"});

    const instances = buildInstances(now);

    // ----- Board: find the relevant instance -----
    const relevant = instances.find(inst => inst.end > now);
    const board = {
      eyebrow: els.boardEyebrow,
      statusLine: els.boardStatusLine,
      course: els.boardCourse,
      courseSub: els.boardCourseSub,
      countdown: els.boardCountdown,
      countdownLabel: els.boardCountdownLabel,
      metaRow: els.boardMetaRow,
    };

    if(!relevant){
      board.eyebrow.textContent = "NO CLASSES SCHEDULED";
      board.statusLine.innerHTML = "";
      board.course.textContent = "You're clear";
      board.courseSub.textContent = "Nothing on the schedule in the next week.";
      board.countdown.textContent = "--:--";
      board.countdownLabel.textContent = "";
      board.metaRow.innerHTML = "";
    } else {
      const { cls, start, end, leaveBy, dayOffset } = relevant;
      const dayLabel = dayOffset === 0 ? "Today" : dayOffset === 1 ? "Tomorrow" : DAY_NAMES[relevant.date.getDay()];
      const sectionTag = cls.section ? " · " + cls.section : "";
      board.course.textContent = cls.code + sectionTag;
      board.courseSub.textContent = cls.title + " — " + cls.building + " " + cls.room;

      let pillHTML = "";
      if(now >= start){
        // in session
        board.eyebrow.textContent = "IN SESSION";
        pillHTML = '<span class="pill good">IN CLASS</span>';
        board.countdown.textContent = fmtCountdown(end - now);
        board.countdownLabel.innerHTML = "until class ends at <b>" + fmtClock(end) + "</b>";
      } else if(now >= leaveBy){
        // should have left
        board.eyebrow.textContent = dayLabel.toUpperCase() + " · LEAVE NOW";
        pillHTML = '<span class="pill urgent">LEAVE NOW</span>';
        board.countdown.textContent = fmtCountdown(start - now);
        board.countdownLabel.innerHTML = "until <b>" + cls.code + "</b> starts at <b>" + fmtClock(start) + "</b> — you're past your " + cls.travel + "-min walk buffer";
      } else {
        // waiting to leave
        board.eyebrow.textContent = dayLabel.toUpperCase() + " · NEXT CLASS";
        pillHTML = '<span class="pill accent">LEAVE BY ' + fmtClock(leaveBy) + '</span>';
        board.countdown.textContent = fmtCountdown(leaveBy - now);
        board.countdownLabel.innerHTML = "until you should leave (" + cls.travel + " min walk) for class at <b>" + fmtClock(start) + "</b>";
      }
      board.statusLine.innerHTML = pillHTML;

      board.metaRow.innerHTML =
        '<div class="meta">STARTS<div class="v tabular">' + fmtClock(start) + '</div></div>' +
        '<div class="meta">ENDS<div class="v tabular">' + fmtClock(end) + '</div></div>' +
        '<div class="meta">WALK<div class="v tabular">' + cls.travel + ' min</div></div>' +
        '<div class="meta">LOCATION<div class="v">' + cls.building + ' ' + cls.room + '</div></div>';
    }

    // ----- Today's timeline -----
    const todays = instances.filter(inst => inst.dayOffset === 0);
    const timeline = els.timeline;
    if(todays.length === 0){
      timeline.innerHTML = '<div class="empty-note">No classes today.</div>';
    } else {
      timeline.innerHTML = todays.map(inst => {
        const { cls, start, end, leaveBy } = inst;
        let rowClass = "", stateHTML = "";
        if(end <= now){
          rowClass = "done";
          stateHTML = '<span class="state done">Done</span>';
        } else if(now >= start){
          rowClass = "current";
          stateHTML = '<span class="state current">In class</span>';
        } else if(now >= leaveBy){
          stateHTML = '<span class="state leave">Leave now</span>';
        } else {
          stateHTML = '<span class="state">Leave ' + fmtClock(leaveBy) + '</span>';
        }
        const sectionTag = cls.section ? " · " + cls.section : "";
        return '<div class="row ' + rowClass + '">' +
          '<div class="time tabular">' + fmtClock(start) + '</div>' +
          '<div><div class="course">' + cls.code + sectionTag + '</div><div class="place">' + cls.building + ' ' + cls.room + ' · ' + cls.travel + ' min walk</div></div>' +
          stateHTML +
          '</div>';
      }).join("");
    }

    // ----- Week strip (only rebuild counts, not per-second) -----
    if(!render._weekBuilt || !sameDate(render._weekBuiltFor||new Date(0), now)){
      const strip = els.weekStrip;
      strip.innerHTML = WEEKDAYS.map(dow => {
        const count = SCHEDULE.filter(c => c.day === dow).length;
        const isToday = dow === now.getDay();
        const label = count === 0 ? "free" : count + " class" + (count>1?"es":"");
        return '<div class="day-chip' + (isToday?" today":"") + '"><div class="d">' + DAY_NAMES[dow] + '</div><div class="n">' + count + '</div><div class="lbl">' + label + '</div></div>';
      }).join("");
      render._weekBuilt = true;
      render._weekBuiltFor = now;
    }
  }

  // ---------- Picture-in-Picture overlay ----------
  // Uses the Document Picture-in-Picture API (Chrome/Edge desktop): it moves the
  // live #board element into a real always-on-top window that floats over other
  // tabs/apps, rather than just mirroring a video. The PiP window shares this
  // page's JS context, so the same render() loop keeps updating it in place.
  const pipBtn = document.getElementById("pipBtn");
  const boardEl = document.getElementById("board");
  let boardHomeParent = boardEl.parentNode;
  let boardHomeNext = boardEl.nextSibling;

  function copyStylesInto(targetDoc){
    [...document.styleSheets].forEach(sheet => {
      try{
        const rules = [...sheet.cssRules].map(r => r.cssText).join("");
        const style = targetDoc.createElement("style");
        style.textContent = rules;
        targetDoc.head.appendChild(style);
      }catch(e){
        if(sheet.href){
          const link = targetDoc.createElement("link");
          link.rel = "stylesheet";
          link.href = sheet.href;
          targetDoc.head.appendChild(link);
        }
      }
    });
  }

  async function openPip(){
    const pipWindow = await documentPictureInPicture.requestWindow({ width: 420, height: 250 });
    copyStylesInto(pipWindow.document);
    pipWindow.document.title = "ClassDash";
    pipWindow.document.documentElement.style.colorScheme = "light dark";
    pipWindow.document.documentElement.style.background = "transparent";
    pipWindow.document.body.style.margin = "0";
    pipWindow.document.body.style.padding = "12px";
    pipWindow.document.body.style.background = "transparent";

    boardHomeParent = boardEl.parentNode;
    boardHomeNext = boardEl.nextSibling;
    pipWindow.document.body.appendChild(boardEl);

    pipBtn.textContent = "✕ Close overlay";
    pipBtn.classList.add("active");

    pipWindow.addEventListener("pagehide", () => {
      boardHomeParent.insertBefore(boardEl, boardHomeNext);
      pipBtn.textContent = "⧉ Pop out";
      pipBtn.classList.remove("active");
    }, { once:true });
  }

  if("documentPictureInPicture" in window){
    pipBtn.addEventListener("click", () => {
      if(documentPictureInPicture.window){
        documentPictureInPicture.window.close();
      } else {
        openPip();
      }
    });
  } else {
    pipBtn.disabled = true;
    pipBtn.textContent = "⧉ Pop out (unsupported)";
    pipBtn.title = "Picture-in-Picture overlays need Chrome or Edge on desktop";
  }

  render();
  setInterval(render, 1000);
})();
</script>
